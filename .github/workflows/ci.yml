name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu x86-64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fakeos repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm \
            qemu-system-x86 \
            binutils-x86-64-linux-gnu \
            build-essential \
            cmake \
            python3

      - name: Build and install fakecc toolchain
        run: |
          # Pin the fakecc toolchain to a known-good revision.
          #
          # fakeos' Milestone 5 self-host (make build / make test) depends on a
          # specific fakecc snapshot:
          #   * it needs the as_nasm "-f bin / -f elf64" assembler feature
          #     (introduced upstream in c53fc4ea, required by FAKECC_BOOT_BIN=1),
          #   * the Makefile/tools document that fakecc tip after 2c1f4525 must
          #     NOT be used because it miscompiles the M5-rebuilt kernel.
          # d79ac7bb reconciles both: it is on mainline after c53fc4ea and is
          # the last validated snapshot before the documented-broken tip, so the
          # CI always stages the same verified toolchain.
          git clone https://github.com/esrrhs/fakecc.git /tmp/fakecc
          git -C /tmp/fakecc checkout d79ac7bb
          cmake -S /tmp/fakecc -B /tmp/fakecc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/fakecc/build --target fakecc --parallel
          sudo cp /tmp/fakecc/build/fakecc /usr/local/bin/fakecc
          fakecc || true

      - name: Build fakeos kernel
        env:
          # Milestone 5 builds a native fakecc from source and stages it into
          # the kernel image, so the staging step needs the fakecc *source
          # tree*, not just the installed binary. Keep this in sync with the
          # clone path above.
          FAKECC_SRC: /tmp/fakecc
        run: |
          make clean
          make build

      - name: Run automated QEMU regression tests
        env:
          FAKECC_SRC: /tmp/fakecc
        run: |
          make test

      - name: Upload kernel binary artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fakeos-kernel-artifacts
          path: |
            build/fakeos.elf
            build/fakeos64.elf
