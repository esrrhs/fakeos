name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu x86-64)
    runs-on: ubuntu-latest
    env:
      # One validated revision for BOTH the initial seed and staged v0/runtime.
      # 42439c8f regenerates the v0/ dialect snapshot from the current src/,
      # so the host compiler (src/) and the compiler bootstrapped inside the
      # OS (v0/) agree on the same input. With the older dfb1c7b pin the
      # snapshot still predated the O0 codegen fixes in src/, and the two
      # compilers produced different bytes for the same source: 41 of 43
      # modules failed the byte-identical comparison, and the O0 codegen
      # defect made the fork-limit probe hang on SMP1.
      FAKECC_REV: 42439c8f60c27872bfa191cfa9dd91c135034fae
      FAKECC_SRC: /tmp/fakecc
      FCC: /usr/local/bin/fakecc

    steps:
      - name: Checkout fakeos repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm \
            qemu-system-x86 \
            binutils-x86-64-linux-gnu \
            build-essential \
            cmake \
            python3

      - name: Build and install fakecc toolchain
        run: |
          # Do not float to tip or mix a seed with a different source snapshot.
          # This revision keeps src/ and the checked-in v0/ dialect snapshot in
          # step (fakecc #119), so the host compiler and the compiler the OS
          # bootstraps for itself produce identical bytes for the same source.
          # Historical M5 pin warnings are not a substitute for testing a
          # coherent seed+source pair: this exact pair passed a clean build and
          # an all-43-object in-OS rebuild.
          # CMake is only for obtaining the initial seed; fakeos and the staged
          # native compiler are then built by fakecc, not a host C toolchain.
          git clone https://github.com/esrrhs/fakecc.git "$FAKECC_SRC"
          git -C "$FAKECC_SRC" checkout --detach "$FAKECC_REV"
          test "$(git -C "$FAKECC_SRC" rev-parse HEAD)" = "$FAKECC_REV"
          cmake -S "$FAKECC_SRC" -B "$FAKECC_SRC/build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$FAKECC_SRC/build" --target fakecc --parallel
          # Install (not just cp the binary): fakecc locates its freestanding
          # runtime/ via <prefix>/share/fakecc/runtime, and `make build` links
          # user programs with fakecc. Copying only the binary leaves no runtime
          # on the system, so linking build/user/*.elf fails with
          # "fakecc: cannot find runtime/".
          sudo cmake --install "$FAKECC_SRC/build"
          fakecc || true

      - name: Build fakeos kernel
        run: |
          make clean
          make build

      - name: Run automated QEMU regression tests
        run: |
          make test

      - name: Upload kernel binary artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fakeos-kernel-artifacts
          path: |
            build/fakeos.elf
            build/fakeos64.elf

      - name: Upload QEMU serial evidence
        uses: actions/upload-artifact@v4
        if: always()
        # Every stage script writes the full guest transcript before it asserts,
        # and those files were the only copy of what the guest actually did. A
        # red run therefore used to be undiagnosable from CI alone: the failure
        # said "boot-complete barrier missing" and the transcript that would say
        # WHICH boot stage never finished was deleted with the runner. Upload
        # them whether the suite passed or failed.
        with:
          name: qemu-serial-evidence
          path: |
            build/**/*.serial.log
            build/**/results.json
          if-no-files-found: warn
